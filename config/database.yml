# MySQL. Versions 5.6.4 and up are supported.
#
# Install the MySQL driver
#   gem install mysql2
#
# Ensure the MySQL gem is defined in your Gemfile
#   gem "mysql2"
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "root") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  port: 3306

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "rails_intro_development") %>

test:
  <<: *default
  database: rails_intro_test

production:
  primary: &primary_production
    <<: *default
    database: rails_intro_production
    username: rails_intro
    password: <%= ENV["RAILS_INTRO_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: rails_intro_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: rails_intro_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: rails_intro_production_cable
    migrations_paths: db/cable_migrate
